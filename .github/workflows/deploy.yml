name: Deploy to Digital Ocean

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual triggering

jobs:
  build-and-push:
    name: Build and Push to DOCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Login to Digital Ocean Container Registry
        run: doctl registry login --expiry-seconds 1200

      - name: Build Docker image
        run: |
          docker build \
            -t registry.digitalocean.com/${{ secrets.DO_REGISTRY_NAME }}/learning-platform-api:${{ github.sha }} \
            -t registry.digitalocean.com/${{ secrets.DO_REGISTRY_NAME }}/learning-platform-api:latest \
            .

      - name: Push image to registry
        run: |
          docker push registry.digitalocean.com/${{ secrets.DO_REGISTRY_NAME }}/learning-platform-api:${{ github.sha }}
          docker push registry.digitalocean.com/${{ secrets.DO_REGISTRY_NAME }}/learning-platform-api:latest

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.DROPLET_SSH_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.DROPLET_HOST }} >> ~/.ssh/known_hosts

      - name: Copy config files to droplet
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
        run: |
          # Clean up any stale Docker-created directories that should be files
          ssh $DROPLET_USER@$DROPLET_HOST "rm -rf /var/www/learning-platform-api/init-db.sh"
          scp docker-compose.prod.yml prometheus.yml init-db.sh \
            $DROPLET_USER@$DROPLET_HOST:/var/www/learning-platform-api/
          ssh $DROPLET_USER@$DROPLET_HOST "mkdir -p /var/www/learning-platform-api/logs"

      - name: Create environment file
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
        run: |
          ssh $DROPLET_USER@$DROPLET_HOST << ENDSSH
            set -e

            # Create .env file with all required environment variables
            cat > /var/www/learning-platform-api/.env << EOF
          # Database Configuration
          LEARN_OPS_DB=${{ secrets.LEARN_OPS_DB }}
          LEARN_OPS_USER=${{ secrets.LEARN_OPS_USER }}
          LEARN_OPS_PASSWORD=${{ secrets.LEARN_OPS_PASSWORD }}
          LEARN_OPS_HOST=db
          LEARN_OPS_PORT=${{ secrets.LEARN_OPS_PORT }}

          # Django Configuration
          LEARN_OPS_DJANGO_SECRET_KEY=${{ secrets.LEARN_OPS_DJANGO_SECRET_KEY }}
          LEARN_OPS_ALLOWED_HOSTS=${{ secrets.LEARN_OPS_ALLOWED_HOSTS }}
          DEBUG=False
          DEVELOPMENT_MODE=False

          # GitHub OAuth
          LEARN_OPS_CLIENT_ID=${{ secrets.LEARN_OPS_CLIENT_ID }}
          LEARN_OPS_SECRET_KEY=${{ secrets.LEARN_OPS_SECRET_KEY }}
          LEARNING_GITHUB_CALLBACK=${{ secrets.LEARNING_GITHUB_CALLBACK }}

          # Superuser
          LEARN_OPS_SUPERUSER_NAME=${{ secrets.LEARN_OPS_SUPERUSER_NAME }}
          LEARN_OPS_SUPERUSER_PASSWORD=${{ secrets.LEARN_OPS_SUPERUSER_PASSWORD }}

          # Python
          PYTHONUNBUFFERED=1
          PYTHONDONTWRITEBYTECODE=1
          EOF

            # Set proper permissions (deploy user created the file, so it's already owned by deploy:deploy)
            chmod 600 /var/www/learning-platform-api/.env

            echo "✅ Environment file created successfully"
          ENDSSH

      - name: Deploy to droplet
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
        run: |
          ssh $DROPLET_USER@$DROPLET_HOST << ENDSSH
            set -e

            # Authenticate with Digital Ocean Container Registry
            echo "🔐 Logging in to container registry..."
            echo "${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}" | docker login registry.digitalocean.com -u ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }} --password-stdin

            # Navigate to application directory
            cd /var/www/learning-platform-api

            # Pull the latest image from DOCR
            echo "📥 Pulling latest image from registry..."
            docker compose -f docker-compose.prod.yml pull web

            # Stop existing containers, then start with new image
            # (down + up avoids docker-compose v1 'ContainerConfig' recreate bug)
            echo "🛑 Stopping existing containers..."
            docker compose -f docker-compose.prod.yml down

            echo "🚀 Starting containers with new image..."
            docker compose -f docker-compose.prod.yml up -d

            # Wait for database to be ready
            echo "⏳ Waiting for database..."
            sleep 60

            # Check container health
            echo "🏥 Checking container health..."
            docker compose -f docker-compose.prod.yml ps

            # Cleanup old images
            echo "🧹 Cleaning up old Docker images..."
            docker image prune -f

            echo "✅ Deployment completed successfully!"
          ENDSSH

      - name: Verify deployment
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
        run: |
          echo "🔍 Verifying deployment..."
          for i in {1..24}; do
            echo "Attempt $i/24..."
            if curl -sf https://api.codenerdcentral.com/health; then
              echo "✅ Health check passed!"
              exit 0
            fi
            sleep 10
          done
          echo "❌ Health check failed after 4 minutes"
          exit 1

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Deployment failed! Check the logs above for details."
